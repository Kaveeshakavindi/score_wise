[alembic]
script_location = app/db/migrations
prepend_sys_path = .
version_path_separator = os
; sqlalchemy.url is intentionally omitted here — app/db/migrations/env.py reads
; DATABASE_URL from Settings so the same env var drives both the app and
; migrations (§14: alembic upgrade head runs as a release step before new
; replicas start serving traffic).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
