[project]
name = "custom-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bcrypt==4.2.1",
    "langchain-anthropic==0.3.14",
    "langchain==0.3.14",
    "psycopg[binary]==3.2.3",
    "python-dotenv==1.0.1",
    "sentence-transformers==3.3.1",
    "torch==2.9.0",
    "scipy==1.15.3",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "gunicorn==23.0.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pgvector==0.3.6",
    "pydantic-settings==2.7.0",
    "pyjwt==2.10.1",
    "redis==5.2.1",
    "python-multipart==0.0.20",
    "websockets==14.1",
    "httpx==0.28.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "chromadb>=1.5.9",
    "pypdf>=6.15.0",
    "onnxruntime<1.24",
]

[tool.uv.sources]
# Vendored wheels are macOS arm64 / CPython 3.10 builds, used only for local
# dev on this machine where PyPI wheel resolution for torch/scipy was
# unavailable. Scoped to darwin so the Linux/Python 3.11 Docker build (§14)
# resolves these normally from PyPI instead of failing on a mismatched wheel.
torch = { path = ".vendor/torch-2.9.0-cp310-none-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin'" }
scipy = { path = ".vendor/scipy-1.15.3-cp310-cp310-macosx_14_0_arm64.whl", marker = "sys_platform == 'darwin'" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
